version: '3.8'

services:
  hobbyhub-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hobbyhub-flutter-app
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - hobbyhub-network

networks:
  hobbyhub-network:
    driver: bridge
