name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]

jobs:
  app-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android local.properties
        run: |
          flutter_root="$(dirname "$(dirname "$(command -v flutter)")")"
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$android_sdk_root" ]; then
            echo "ANDROID_SDK_ROOT is not set"
            exit 1
          fi

          printf 'sdk.dir=%s\nflutter.sdk=%s\nflutter.buildMode=debug\nflutter.versionName=1.0.0\nflutter.versionCode=1\n' \
            "$android_sdk_root" "$flutter_root" > local.properties
        working-directory: apps/android

      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps

      - name: Flutter analyze
        run: flutter analyze
        working-directory: apps

      - name: Flutter test
        run: flutter test
        working-directory: apps

      - name: Android assembleDebug
        run: ./gradlew :app:assembleDebug
        working-directory: apps/android
